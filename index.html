<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Agentic Jobs — AI Job Discovery & Application Tracking</title>

    <meta
      name="description"
      content="AI-powered job discovery, resume matching, recommendation, and application-tracking platform."
    />
    <meta
      property="og:title"
      content="Agentic Jobs — AI Job Discovery & Application Tracking"
    />
    <meta
      property="og:description"
      content="AI-powered job discovery, resume matching, recommendation, and application-tracking platform built by M Talha Iftikhar & Laiba Asif."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#10120E" />

    <link rel="canonical" href="https://agenticjobs.netlify.app/" />

    <!-- Agentic Jobs App Icons -->
    <link rel="icon" type="image/svg+xml" href="/agentic-jobs-mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon.png" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Agentic Jobs",
        "url": "https://agenticjobs.netlify.app",
        "description": "AI-powered job discovery, resume matching, recommendation, and application-tracking platform.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "All",
        "creator": [
          {
            "@type": "Person",
            "name": "M Talha Iftikhar"
          },
          {
            "@type": "Person",
            "name": "Laiba Asif"
          }
        ]
      }
    </script>
    <script>
      try {
        const theme = localStorage.getItem('agentic-jobs-theme') === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        const themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.content = theme === 'dark' ? '#10120E' : '#F3F4EA';
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>

  <body class="app-shell antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
