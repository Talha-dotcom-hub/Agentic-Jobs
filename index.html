<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Agentic Jobs — AI Job Discovery & Application Tracking</title>

    <meta
      name="description"
      content="AI-Powered SaaS Job Discovery, Resume Matching & Application Tracking Platform."
    />
    <meta
      property="og:title"
      content="Agentic Jobs — AI Job Discovery & Application Tracking"
    />
    <meta
      property="og:description"
      content="AI-Powered SaaS Job Discovery, Resume Matching & Application Tracking Platform."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0A0A0B" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />

    <link rel="canonical" href="https://agenticjobs.netlify.app/" />

    <!-- Agentic Jobs App Icons -->
    <link rel="icon" type="image/svg+xml" href="/agentic-jobs-mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon.png" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Agentic Jobs",
        "url": "https://agenticjobs.netlify.app",
        "description": "AI-Powered SaaS Job Discovery, Resume Matching & Application Tracking Platform.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "All",
        "creator": {
          "@type": "Person",
          "name": "M Talha Iftikhar"
        }
      }
    </script>
    <script>
      try {
        const savedTheme = localStorage.getItem('agentic-jobs-theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : prefersDark ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        const themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.content = theme === 'dark' ? '#10120E' : '#EEF2F1';
      } catch {
        const theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      }
    </script>
  </head>

  <body class="app-shell antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
