# Netlify Configuration for Agentic Jobs
# Static Frontend SPA with API Proxy & Security Headers

[build]
  command = "npm run build"
  publish = "dist"

# Proxy /api routes to the production backend server or container
[[redirects]]
  from = "/api/*"
  to = "https://agentic-jobs-api.example.com/api/:splat"
  status = 200
  force = false

# SPA Routing: fallback all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
